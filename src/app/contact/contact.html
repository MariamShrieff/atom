<div class="container py-5">

  <div class="text-center mb-5">

    <h1 class="fw-bold">
      Contact Us
    </h1>

    <p class="text-muted">
      Have a question? Send us a message.
    </p>

  </div>


  <div class="row justify-content-center">

    <div class="col-lg-8">

      <div class="card border-0 shadow">

        <div class="card-body p-5">

          <form>

            <div class="row g-3">

              <div class="col-md-6">

                <label class="form-label">
                  First Name
                </label>

                <input
                  type="text"
                  class="form-control"
                  placeholder="Enter your first name"
                >

              </div>


              <div class="col-md-6">

                <label class="form-label">
                  Last Name
                </label>

                <input
                  type="text"
                  class="form-control"
                  placeholder="Enter your last name"
                >

              </div>


              <div class="col-12">

                <label class="form-label">
                  Email
                </label>

                <input
                  type="email"
                  class="form-control"
                  placeholder="example@email.com"
                >

              </div>


              <div class="col-12">

                <label class="form-label">
                  Subject
                </label>

                <input
                  type="text"
                  class="form-control"
                  placeholder="Message subject"
                >

              </div>


              <div class="col-12">

                <label class="form-label">
                  Message
                </label>

                <textarea
                  class="form-control"
                  rows="5"
                  placeholder="Write your message..."
                ></textarea>

              </div>


              <div class="col-12">

                <button
                  type="submit"
                  class="btn btn-primary w-100 py-2"
                >
                  Send Message
                </button>

              </div>

            </div>

          </form>

        </div>

      </div>

    </div>

  </div>

</div>
